services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ibn
      POSTGRES_USER: ibn
      POSTGRES_PASSWORD: ibn_dev_only
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ibn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ibn-postgres-data: